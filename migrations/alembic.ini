# =============================================================================
# alembic.ini – PipeAgent Database Migration Configuration
# =============================================================================

[alembic]
# مسیر پوشه اسکریپت‌های مایگریشن
script_location = migrations

# اضافه کردن مسیر ریشه پروژه به sys.path جهت ایمپورت امن ماژول‌های db و config
prepend_sys_path = .

# فرمت نام‌گذاری فایل‌های مایگریشن (مرتب‌سازی بر اساس زمان و عنوان خوانا)
# نمونه خروجی: 20250330_1430_a1b2c3d4e5f6_add_welder_qualification_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# منطقه زمانی برای تولید تاریخ مایگریشن‌ها
timezone = UTC

# حداکثر طول مجاز برای متن توضیحات مایگریشن در نام فایل
truncate_slug_length = 40

# پوشه‌های تفکیک‌شده برای نسخه‌ها (در صورت نیاز به ماژولار بودن)
version_locations = %(here)s/migrations/versions

# آدرس اتصال دیتابیس پیش‌فرض (این مقدار به صورت پویا توسط env.py از config.DATABASE_URL بازنویسی می‌شود)
sqlalchemy.url = sqlite:///pipeagent.db

# -----------------------------------------------------------------------------
# Post-Write Hooks (قالب‌بندی خودکار کدهای پایتون پس از تولید مایگریشن)
# -----------------------------------------------------------------------------
[post_write_hooks]
# در صورت نصب بودن ruff یا black، اسکریپت به صورت خودکار مرتب‌سازی و Clean می‌شود
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/venv/bin/ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# -----------------------------------------------------------------------------
# Logging Configurations (پیکربندی لاگ سیستم مایگریشن)
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = [%(asctime)s] [%(levelname)-7.7s] [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S