<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PipeAgent — User Guide</title>
<meta name="description" content="PipeAgent Piping Execution Operating System — user guide and field workflow reference for EPC piping projects.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23087f8c'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>P</text></svg>">
<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}

:root{
  --teal:#087f8c; --cyan:#13a7b5; --ink:#173b45; --muted:#64818a;
  --bg:#f4fbfc; --card:#fff; --line:#cbe8eb;
  --soft:#eaf8f9; --soft2:#d8f5f6; --code:#edf7f8;
  --shadow:0 4px 14px rgba(10,100,112,.10);
  --radius:14px; --maxw:1180px;
}

html[data-theme="dark"]{
  --teal:#57d3de; --cyan:#2fbccb; --ink:#e7f6f8; --muted:#93b3ba;
  --bg:#0a1a1e; --card:#112a30; --line:#1e454e;
  --soft:#123037; --soft2:#16414a; --code:#0f2a31;
  --shadow:0 4px 18px rgba(0,0,0,.40);
}

/* ============================================================
   2. BASE
   ============================================================ */
html{scroll-behavior:smooth;scroll-padding-top:88px}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,Arial,Tahoma,sans-serif;
  line-height:1.7;font-size:15px;
  transition:background .25s ease,color .25s ease;
  -webkit-text-size-adjust:100%;
}
b,strong{color:var(--teal)}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}

.skip-link{
  position:absolute;left:-9999px;top:0;z-index:200;
  background:var(--card);color:var(--teal);padding:10px 16px;
  border-radius:0 0 10px 10px;font-weight:700;text-decoration:none;
}
.skip-link:focus{left:12px}

/* ============================================================
   3. READING PROGRESS
   ============================================================ */
#progress{
  position:fixed;top:0;left:0;height:3px;width:0;
  background:linear-gradient(90deg,var(--teal),var(--cyan));
  z-index:120;transition:width .08s linear;
}

/* ============================================================
   4. HERO
   ============================================================ */
.hero{
  background:linear-gradient(110deg,#087f8c,#13a7b5,#55c7d0);
  color:#fff;padding:32px 7% 24px;
  box-shadow:0 3px 18px rgba(8,127,140,.28);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-80px;top:-80px;
  width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);
  pointer-events:none;
}
.hero-inner{
  max-width:var(--maxw);margin:0 auto;position:relative;z-index:1;
  display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:54px;height:54px;border-radius:15px;flex:0 0 auto;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);
  display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:.5px;
}
.hero h1{margin:0;font-size:clamp(25px,4vw,34px);line-height:1.2;letter-spacing:.3px}
.hero .tagline{margin:4px 0 0;color:#eaffff;font-size:13.5px;opacity:.95}

.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  background:rgba(255,255,255,.16);color:#fff;
  border:1px solid rgba(255,255,255,.42);border-radius:10px;
  padding:8px 15px;font:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:background .2s,transform .15s;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}

.searchbar{max-width:var(--maxw);margin:20px auto 0;position:relative;z-index:1}
.searchbar .ico{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  opacity:.5;pointer-events:none;font-size:15px;
}
.searchbar input{
  width:100%;padding:12px 42px;
  border-radius:12px;border:1px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.96);color:#173b45;
  font:inherit;font-size:14px;outline:none;
  box-shadow:0 4px 16px rgba(0,0,0,.14);transition:box-shadow .2s,border-color .2s;
}
.searchbar input::placeholder{color:#7d979e}
.searchbar input:focus{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.28)}
.searchbar kbd{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:11px;background:rgba(8,127,140,.1);color:#087f8c;
  border:1px solid rgba(8,127,140,.22);border-radius:6px;padding:2px 7px;
  font-family:inherit;pointer-events:none;
}

/* ============================================================
   5. STICKY NAV
   ============================================================ */
.nav{
  position:sticky;top:0;z-index:60;
  background:var(--card);border-bottom:1px solid var(--line);
  box-shadow:0 2px 12px rgba(10,100,112,.07);
}
.nav .inner{
  max-width:var(--maxw);margin:0 auto;padding:8px 20px;
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;
}
.nav .inner::-webkit-scrollbar{height:5px}
.nav .inner::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.nav a{
  color:var(--muted);text-decoration:none;font-weight:700;font-size:13.5px;
  padding:8px 13px;border-radius:9px;white-space:nowrap;
  transition:background .18s,color .18s;
}
.nav a:hover{background:var(--soft);color:var(--teal)}
.nav a.active{background:var(--soft2);color:var(--teal)}

/* ============================================================
   6. LAYOUT + CARDS
   ============================================================ */
.wrap{max-width:var(--maxw);margin:26px auto 0;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px}

.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);
  margin-bottom:18px;scroll-margin-top:86px;
  animation:rise .35s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .card{animation:none}
  html{scroll-behavior:auto}
}

.card > h2{
  margin:0 0 16px;color:var(--teal);font-size:20px;
  display:flex;align-items:center;gap:10px;
  padding-bottom:12px;border-bottom:1px dashed var(--line);
}
.card > h2 .ico{font-size:19px;line-height:1}

.mini{
  background:var(--soft);border:1px solid var(--line);
  border-radius:12px;padding:16px 18px;
}
.mini h3{margin:0 0 8px;font-size:15px;color:var(--teal)}
.mini p{margin:0 0 6px}
.mini p:last-child{margin-bottom:0}
.mini ul,.mini ol{margin:6px 0 0;padding-left:20px}
.mini li{margin:3px 0}

/* ============================================================
   7. STEPS
   ============================================================ */
.step{display:flex;gap:12px;margin:12px 0;align-items:flex-start}
.num{
  min-width:30px;height:30px;border-radius:50%;
  background:var(--soft2);color:var(--teal);
  font-weight:800;font-size:14px;display:grid;place-items:center;
  flex:0 0 auto;margin-top:4px;
}

/* ============================================================
   8. CALLOUT
   ============================================================ */
.tip{
  background:var(--soft);padding:13px 16px;border-radius:10px;
  border-left:4px solid var(--cyan);margin-top:14px;font-size:14.5px;
}

/* ============================================================
   9. TABLES
   ============================================================ */
.table-scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--card);min-width:520px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);font-size:14.5px}
th{background:var(--soft);color:var(--teal);font-weight:800;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--soft)}

/* ============================================================
   10. CHECKLIST
   ============================================================ */
.check-item{
  display:flex;gap:11px;align-items:flex-start;
  padding:9px 12px;border-radius:10px;transition:background .18s;
}
.check-item:hover{background:var(--soft)}
.check-item input{
  width:19px;height:19px;accent-color:var(--teal);
  margin-top:6px;flex:0 0 auto;cursor:pointer;
}
.check-item label{cursor:pointer;flex:1}
.check-item input:checked + label{opacity:.5;text-decoration:line-through}

/* ============================================================
   11. FAQ
   ============================================================ */
details.faq{
  border:1px solid var(--line);border-radius:11px;
  padding:4px 16px;margin:9px 0;background:var(--card);
  transition:background .18s;
}
details.faq[open]{background:var(--soft)}
details.faq summary{
  cursor:pointer;font-weight:700;color:var(--teal);
  padding:11px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;
}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"＋";font-weight:400;opacity:.7}
details.faq[open] summary::after{content:"－"}
details.faq p{margin:0 0 14px;font-size:14.5px}

/* ============================================================
   12. GLOSSARY
   ============================================================ */
.glossary{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.glossary .term{
  background:var(--soft);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;
}
.glossary .term b{display:block;color:var(--teal);font-size:13.5px}
.glossary .term span{font-size:13.5px;color:var(--muted)}

/* ============================================================
   13. PROMO + FOOTER
   ============================================================ */
.promo{
  background:linear-gradient(120deg,var(--card),var(--soft));
  border:1px solid var(--line);
}
.promo .slogan{
  margin:12px 0 0;font-weight:800;color:var(--teal);
  font-size:16px;letter-spacing:.2px;
}
footer{
  text-align:center;color:var(--muted);
  padding:32px 20px 44px;font-size:13.5px;
  border-top:1px solid var(--line);margin-top:20px;
}

/* ============================================================
   14. BACK TO TOP
   ============================================================ */
#toTop{
  position:fixed;right:22px;bottom:22px;z-index:90;
  width:44px;height:44px;border-radius:50%;
  background:var(--teal);color:#fff;border:none;
  font-size:19px;cursor:pointer;box-shadow:0 6px 18px rgba(8,127,140,.4);
  opacity:0;visibility:hidden;transform:translateY(12px);
  transition:opacity .25s,transform .25s,visibility .25s;
}
#toTop.show{opacity:1;visibility:visible;transform:none}
#toTop:hover{background:var(--cyan)}

/* ============================================================
   15. EMPTY STATE
   ============================================================ */
#noResults{
  display:none;text-align:center;padding:34px 20px;
  background:var(--card);border:1px dashed var(--line);
  border-radius:var(--radius);color:var(--muted);font-weight:700;
}
#noResults.show{display:block}

/* ============================================================
   16. PRINT
   ============================================================ */
@media print{
  .nav,.tools,.searchbar,#toTop,#progress,.skip-link{display:none !important}
  body{background:#fff;color:#000;font-size:11pt;line-height:1.5}
  .hero{background:#087f8c !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;page-break-inside:avoid;margin-bottom:10px}
  details.faq{border:1px solid #ccc}
  a[href^="#"]::after{content:""}
}

/* ============================================================
   17. RESPONSIVE
   ============================================================ */
@media (max-width:640px){
  .hero{padding:24px 5% 20px}
  .logo{width:44px;height:44px;font-size:16px;border-radius:12px}
  .wrap{padding:0 14px}
  .card{padding:18px;border-radius:12px}
  .card > h2{font-size:18px}
  .btn{padding:7px 12px;font-size:12.5px}
  .searchbar kbd{display:none}
  table{min-width:440px}
}
</style>
</head>
<body>

<a class="skip-link" href="#content">Skip to content</a>
<div id="progress" role="presentation"></div>

<!-- ==================== HERO ==================== -->
<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <div class="logo" aria-hidden="true">PA</div>
      <div>
        <h1>PipeAgent</h1>
        <p class="tagline">Piping Execution Operating System — User Guide &amp; Field Workflow Reference</p>
      </div>
    </div>
    <div class="tools">
      <button class="btn" id="themeBtn" type="button" aria-label="Toggle light and dark theme">🌙 Dark</button>
      <button class="btn" id="printBtn" type="button" aria-label="Print guide">🖨 Print</button>
    </div>
  </div>

  <div class="searchbar">
    <span class="ico" aria-hidden="true">🔍</span>
    <input id="search" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search the guide…" aria-label="Search the guide" aria-controls="content">
    <kbd>Ctrl K</kbd>
  </div>
</header>

<!-- ==================== NAV ==================== -->
<nav class="nav" aria-label="Guide sections">
  <div class="inner" id="navInner"></div>
</nav>

<!-- ==================== CONTENT ==================== -->
<main class="wrap" id="content"></main>

<div class="wrap"><p id="noResults" role="status"></p></div>

<footer>
  PipeAgent · Piping Execution Operating System · Built for practical EPC site execution
</footer>

<button id="toTop" type="button" aria-label="Back to top">↑</button>

<script>
/* ================================================================
   PipeAgent User Guide — English edition
   ----------------------------------------------------------------
   1. SECTIONS[]  → single source of truth (id, icon, nav label, body)
   2. render()    → builds nav + content
   3. bind()      → scroll spy, checklist restore, active search
   Adding a section = push one object into SECTIONS.
   ================================================================ */

/* ---------- 1. SECTIONS ---------- */
const SECTIONS = [

/* ============ QUICK START ============ */
{
  id:'start', icon:'🚀', nav:'Quick Start',
  body:`
    <div class="step"><span class="num">1</span><div>Sign in and start from <b>PipeAgent → Dashboard</b>. The dashboard is the command center for project status and execution signals.</div></div>
    <div class="step"><span class="num">2</span><div>Set up the project, line list, documents and core execution registers <b>before</b> entering large volumes of field data.</div></div>
    <div class="step"><span class="num">3</span><div>Use <b>Quick Entry</b> for fast individual updates, or <b>Data Exchange</b> for controlled bulk loading.</div></div>
    <div class="step"><span class="num">4</span><div>Move work through Fit-up → Weld → QC → NDT → Repair → Acceptance and then into testing, completion and turnover.</div></div>
    <div class="tip"><b>Field rule:</b> enter evidence at the point of work. A short, accurate record beats a late bulk update every time.</div>
  `
},

/* ============ EXECUTION LIFECYCLE ============ */
{
  id:'workflow', icon:'🔁', nav:'Execution Flow',
  body:`
    <div class="table-scroll">
      <table>
        <thead><tr><th>Stage</th><th>Typical PipeAgent Area</th><th>Execution Objective</th></tr></thead>
        <tbody>
          <tr><td>Engineering</td><td>Project Setup, Documents, Line List</td><td>Establish controlled design and line context.</td></tr>
          <tr><td>Material</td><td>Procurement / Material Tracking</td><td>Confirm receipt, heat/lot traceability and availability.</td></tr>
          <tr><td>Fabrication</td><td>Spooling, Joints, Welder Management</td><td>Control spool and weld execution.</td></tr>
          <tr><td>Site Installation</td><td>Field Erection, Supports, Valves</td><td>Track installation and field readiness.</td></tr>
          <tr><td>Quality</td><td>QA/QC, NDT, Punch</td><td>Capture inspection results and close defects.</td></tr>
          <tr><td>Testing</td><td>Test Packages, Pre-Commissioning, Finishing</td><td>Prove system readiness.</td></tr>
          <tr><td>Completion</td><td>Handover, Digital Turnover, As-Built</td><td>Build a traceable turnover package.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="tip">A stage is only <b>complete</b> when its evidence is recorded — not when the physical work is finished.</div>
  `
},

/* ============ MENUS ============ */
{
  id:'menus', icon:'🧭', nav:'Menus',
  body:`
    <div class="grid">
      <div class="mini">
        <h3>PipeAgent Menu</h3>
        <p>The primary navigation menu. <b>Dashboard</b> is the first entry, followed by the complete execution modules grouped by discipline and lifecycle stage.</p>
      </div>
      <div class="mini">
        <h3>File Menu</h3>
        <ul>
          <li>Open Project Folder</li>
          <li>Import Excel / Data</li>
          <li>Export Full Project Pack</li>
          <li>Backup Database</li>
          <li>Open Backup Folder</li>
          <li>Print Current View</li>
          <li>Refresh, Logout, Exit</li>
        </ul>
      </div>
      <div class="mini">
        <h3>Help Menu</h3>
        <p>Open this guide, the Persian guide, About, License Information, Keyboard Shortcuts and WhatsApp Support.</p>
      </div>
    </div>
  `
},

/* ============ DATA EXCHANGE ============ */
{
  id:'data', icon:'📊', nav:'Data Exchange',
  body:`
    <p>Use the <b>Data Exchange Center</b> for controlled bulk data operations.</p>
    <ol>
      <li>Select the target data type.</li>
      <li>Select an Excel workbook and run <b>Analyze</b>.</li>
      <li>Review errors and duplicates in Preview.</li>
      <li>Import only valid records.</li>
      <li>Use templates before starting a new bulk import.</li>
      <li>Use the Full Project Excel Pack when a complete export is required.</li>
    </ol>
    <div class="tip">Analysis is read-only — no persistent change is written until <b>Import Valid Records</b> is pressed.</div>
  `
},

/* ============ QUALITY ============ */
{
  id:'quality', icon:'✅', nav:'Quality',
  body:`
    <div class="grid">
      <div class="mini"><h3>Work Front</h3><p>Use readiness, crew, equipment, progress and blocker information to keep productive work moving.</p></div>
      <div class="mini"><h3>QA/QC &amp; NDT</h3><p>Record inspection status, reports, findings, NCRs and punch clearance with traceable identifiers.</p></div>
      <div class="mini"><h3>Site Execution Control</h3><p>Coordinate loop checks, permits, equipment, site issues and commissioning readiness.</p></div>
      <div class="mini"><h3>Execution Intelligence</h3><p>Use predictive signals and constraint visibility to identify what may affect future work.</p></div>
    </div>
  `
},

/* ============ TURNOVER ============ */
{
  id:'turnover', icon:'📦', nav:'Turnover',
  body:`
    <p>Turnover should be assembled continuously rather than at the end of construction. Keep test records, punch status, quality evidence, documents and as-built information connected to the relevant line, spool, system or package.</p>
    <p><b>Recommended habit:</b> when an activity is completed, ask “What evidence will the turnover team need later?” and capture it now.</p>
    <div class="tip">A turnover package is a by-product of daily execution — not a separate project in the final month.</div>
  `
},

/* ============ ROLES ============ */
{
  id:'roles', icon:'👥', nav:'Roles',
  body:`
    <div class="table-scroll">
      <table>
        <thead><tr><th>Role</th><th>Primary responsibility</th><th>Key PipeAgent areas</th></tr></thead>
        <tbody>
          <tr><td>QC Inspector</td><td>Record inspection results, NCRs and punch clearance</td><td>QA/QC, NDT, Punch</td></tr>
          <tr><td>Welding Engineer</td><td>Control WPS/PQR, welder qualification and weld maps</td><td>Welder Management, Joints</td></tr>
          <tr><td>Site Supervisor</td><td>Drive work fronts and remove blockers</td><td>Field Erection, Work Front</td></tr>
          <tr><td>Piping Engineer</td><td>Data quality of line list, spools and documents</td><td>Line List, Spooling, Documents</td></tr>
          <tr><td>Planning / Project Control</td><td>Progress, weights and delay signals</td><td>Dashboard, Execution Intelligence</td></tr>
          <tr><td>Material Controller</td><td>Receipts, heat/lot traceability and availability</td><td>Procurement, Material Tracking</td></tr>
          <tr><td>Turnover Coordinator</td><td>Assemble and validate the turnover package</td><td>Digital Turnover, As-Built</td></tr>
          <tr><td>Project Manager</td><td>Decision making and prioritisation</td><td>Dashboard, Reports</td></tr>
        </tbody>
      </table>
    </div>
  `
},

/* ============ DAILY ROUTINE ============ */
{
  id:'daily', icon:'🗓', nav:'Daily Routine',
  body:`
    <p>This short checklist locks the daily execution rhythm into PipeAgent. Tick states are saved in this browser, so the list survives a page refresh.</p>
    <div id="checklist">
      <div class="check-item"><input type="checkbox" id="d1" data-key="d1"><label for="d1">Morning: review the Dashboard and constraint signals.</label></div>
      <div class="check-item"><input type="checkbox" id="d2" data-key="d2"><label for="d2">Issue the daily work front and confirm crew / equipment readiness.</label></div>
      <div class="check-item"><input type="checkbox" id="d3" data-key="d3"><label for="d3">Record fit-up and weld results the same day.</label></div>
      <div class="check-item"><input type="checkbox" id="d4" data-key="d4"><label for="d4">Update QA/QC status and raise NDT requests.</label></div>
      <div class="check-item"><input type="checkbox" id="d5" data-key="d5"><label for="d5">Record heat/lot of material consumed against the joint.</label></div>
      <div class="check-item"><input type="checkbox" id="d6" data-key="d6"><label for="d6">Close clearable punches and attach the evidence.</label></div>
      <div class="check-item"><input type="checkbox" id="d7" data-key="d7"><label for="d7">End of day: run a backup and review data-entry errors.</label></div>
    </div>
  `
},

/* ============ SHORTCUTS ============ */
{
  id:'shortcuts', icon:'⌨️', nav:'Shortcuts',
  body:`
    <div class="table-scroll">
      <table>
        <thead><tr><th>Key</th><th>Action</th></tr></thead>
        <tbody>
          <tr><td><code>Ctrl</code> + <code>K</code></td><td>Focus the guide search box</td></tr>
          <tr><td><code>Ctrl</code> + <code>Shift</code> + <code>D</code></td><td>Toggle light / dark theme</td></tr>
          <tr><td><code>Esc</code></td><td>Clear the search</td></tr>
          <tr><td><code>Ctrl</code> + <code>P</code></td><td>Print the guide</td></tr>
          <tr><td><code>Home</code></td><td>Scroll to the top</td></tr>
        </tbody>
      </table>
    </div>
    <div class="tip"><code>Ctrl</code> + <code>K</code> works from anywhere in the guide.</div>
  `
},

/* ============ GLOSSARY ============ */
{
  id:'glossary', icon:'📖', nav:'Glossary',
  body:`
    <div class="glossary">
      <div class="term"><b>Line List</b><span>Controlled register of all project piping lines.</span></div>
      <div class="term"><b>Spool</b><span>A pre-fabricated pipe piece assembled in shop or field.</span></div>
      <div class="term"><b>Joint</b><span>A welded connection; the primary quality traceability unit.</span></div>
      <div class="term"><b>Fit-up</b><span>Aligning and setting components before welding.</span></div>
      <div class="term"><b>Heat / Lot</b><span>Melt and batch number used for material traceability.</span></div>
      <div class="term"><b>NDT</b><span>Non-destructive testing used to prove weld quality.</span></div>
      <div class="term"><b>NCR</b><span>Non-conformance report; a deviation requiring disposition.</span></div>
      <div class="term"><b>Punch</b><span>A minor outstanding defect to be cleared before handover.</span></div>
      <div class="term"><b>Test Package</b><span>A system boundary prepared for pressure testing.</span></div>
      <div class="term"><b>Loop Check</b><span>Verifying an instrument loop from sensor to control system.</span></div>
      <div class="term"><b>Work Front</b><span>A ready work area where crews can be productive.</span></div>
      <div class="term"><b>Constraint</b><span>Anything blocking the start or progress of work.</span></div>
      <div class="term"><b>As-Built</b><span>Final documentation matching the constructed reality.</span></div>
      <div class="term"><b>Turnover</b><span>Handing over systems together with their evidence.</span></div>
    </div>
  `
},

/* ============ FAQ ============ */
{
  id:'faq', icon:'❓', nav:'FAQ',
  body:`
    <details class="faq" open>
      <summary>Does Analyze modify my data?</summary>
      <p>No. Analyze only reads the workbook and reports errors and duplicates. Nothing is persistently written until you press <b>Import Valid Records</b>.</p>
    </details>
    <details class="faq">
      <summary>When should I use Quick Entry instead of Data Exchange?</summary>
      <p>Use <b>Quick Entry</b> for a single record captured at the point of work by field staff. Use <b>Data Exchange</b> for bulk loading, data cleansing and migration from other systems.</p>
    </details>
    <details class="faq">
      <summary>When should turnover documentation start?</summary>
      <p>From the very first execution activity. Every test record, punch, quality document and as-built mark-up should be linked to its line, spool, system or package immediately.</p>
    </details>
    <details class="faq">
      <summary>How often should I back up?</summary>
      <p>At minimum at the end of each working day, and before any large import. Use <b>File → Backup Database</b>.</p>
    </details>
    <details class="faq">
      <summary>What if I entered something incorrectly?</summary>
      <p>Correct the record and, where required, raise an NCR or correction note. Do not delete history — traceability matters more than a clean-looking dataset.</p>
    </details>
    <details class="faq">
      <summary>Who owns the data quality in PipeAgent?</summary>
      <p>The person who performs the activity. The <b>Piping Engineer</b> guards line list and spool structure, the <b>QC Inspector</b> guards inspection evidence, the <b>Material Controller</b> guards heat/lot records, and the <b>Turnover Coordinator</b> validates the final package.</p>

/* ---------- 2. HELPERS ---------- */
const STORE = { theme:'pipeagent.en.theme', chk:'pipeagent.en.checklist.v1' };

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

const state = {
  theme: safeGet(STORE.theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
};

/* ---------- 3. RENDER ---------- */
let observer = null;

function render(){
  document.documentElement.dataset.theme = state.theme;
  $('#themeBtn').textContent = state.theme === 'dark' ? '☀️ Light' : '🌙 Dark';

  $('#navInner').innerHTML = SECTIONS
    .map(s => `<a href="#${s.id}" data-target="${s.id}">${s.nav}</a>`)
    .join('');

  $('#content').innerHTML = SECTIONS
    .map(s => `
      <section id="${s.id}" class="card" aria-labelledby="h-${s.id}">
        <h2 id="h-${s.id}"><span class="ico" aria-hidden="true">${s.icon}</span>${s.nav}</h2>
        ${s.body}
      </section>`)
    .join('');

  bind();
}

/* ---------- 4. BIND AFTER RENDER ---------- */
function bind(){
  restoreChecklist();
  setupScrollSpy();
  applySearch($('#search').value);
}

/* 4a. Scroll spy */
function setupScrollSpy(){
  if(observer) observer.disconnect();

  const links = $$('#navInner a');
  const map   = new Map(links.map(a => [a.dataset.target, a]));

  observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const link = map.get(entry.target.id);
      if(!link || !entry.isIntersecting) return;
      links.forEach(a => a.classList.remove('active'));
      link.classList.add('active');
    });
  }, { rootMargin:'-86px 0px -65% 0px', threshold:0 });

  SECTIONS.forEach(s => {
    const el = document.getElementById(s.id);
    if(el) observer.observe(el);
  });
}

/* 4b. Search */
function applySearch(raw){
  const q = (raw || '').trim().toLowerCase();
  let visible = 0;

  $$('#content .card').forEach(card => {
    const hit = !q || card.textContent.toLowerCase().includes(q);
    card.style.display = hit ? '' : 'none';
    if(hit) visible++;
  });

  $$('#navInner a').forEach(a => {
    const el = document.getElementById(a.dataset.target);
    a.style.display = (el && el.style.display === 'none') ? 'none' : '';
  });

  const empty = $('#noResults');
  empty.textContent = visible === 0 ? 'No matching section found. Try a different keyword.' : '';
  empty.classList.toggle('show', visible === 0);
}

/* 4c. Checklist */
function restoreChecklist(){
  let saved = {};
  try{ saved = JSON.parse(safeGet(STORE.chk) || '{}'); }catch(e){ saved = {}; }
  $$('#checklist input[type="checkbox"]').forEach(cb => {
    cb.checked = !!saved[cb.dataset.key];
  });
}

document.addEventListener('change', e => {
  const cb = e.target;
  if(!cb.matches || !cb.matches('#checklist input[type="checkbox"]')) return;
  let saved = {};
  try{ saved = JSON.parse(safeGet(STORE.chk) || '{}'); }catch(e){ saved = {}; }
  saved[cb.dataset.key] = cb.checked;
  safeSet(STORE.chk, JSON.stringify(saved));
});

/* ---------- 5. CONTROLS ---------- */
$('#themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  safeSet(STORE.theme, state.theme);
  document.documentElement.dataset.theme = state.theme;
  $('#themeBtn').textContent = state.theme === 'dark' ? '☀️ Light' : '🌙 Dark';
});

$('#printBtn').addEventListener('click', () => window.print());

$('#search').addEventListener('input', e => applySearch(e.target.value));

$('#search').addEventListener('keydown', e => {
  if(e.key === 'Escape'){ e.target.value = ''; applySearch(''); e.target.blur(); }
});

/* ---------- 6. GLOBAL SHORTCUTS ---------- */
document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;

  if(ctrl && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    $('#search').focus();
    $('#search').select();
  }

  if(ctrl && e.shiftKey && e.key.toLowerCase() === 'd'){
    e.preventDefault();
    $('#themeBtn').click();
  }
});

/* ---------- 7. PROGRESS BAR + BACK TO TOP ---------- */
const progress = $('#progress');
const toTop    = $('#toTop');
let ticking = false;

function onScroll(){
  const doc = document.documentElement;
  const max = doc.scrollHeight - doc.clientHeight;
  progress.style.width = (max > 0 ? (doc.scrollTop / max) * 100 : 0) + '%';
  toTop.classList.toggle('show', doc.scrollTop > 400);
  ticking = false;
}

window.addEventListener('scroll', () => {
  if(!ticking){ requestAnimationFrame(onScroll); ticking = true; }
}, { passive:true });

toTop.addEventListener('click', () => window.scrollTo({ top:0, behavior:'smooth' }));

/* ---------- 8. BOOT ---------- */
render();
onScroll();
</script>
</body>
</html>
